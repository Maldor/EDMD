on:
  workflow_dispatch:
  
jobs:
  pyinstaller-build:
    runs-on: windows-latest, ubuntu-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.14'
          spec: 'src/edmd_rel.spec'
          requirements: 'src/requirements.txt'
          upload_exe_with_name: 'EDMD'
